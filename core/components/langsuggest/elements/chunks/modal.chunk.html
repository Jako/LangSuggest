<style>
    #langsuggestModal {
        width: calc(100% - 20px);
        max-width: 600px;
        padding: 0;
        border: 0;
        background: transparent;
        overflow: visible;
    }
    #langsuggestModal::backdrop {
        background: rgba(0, 0, 0, .5);
    }
    #langsuggestModal .modal-content {
        position: relative;
        margin: 0;
        background: #fff;
        border: 1px solid rgba(0, 0, 0, .2);
        border-radius: 6px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, .5);
    }
    #langsuggestModal .modal-header {
        padding: 15px;
        border-bottom: 1px solid #e5e5e5;
    }
    #langsuggestModal .modal-title {
        margin: 0;
    }
    #langsuggestModal .modal-body {
        padding: 15px;
    }
    #langsuggestModal .modal-footer {
        padding: 15px;
        text-align: right;
        border-top: 1px solid #e5e5e5;
    }
    #langsuggestModal .close {
        float: right;
        padding: 0;
        border: 0;
        background: transparent;
        font-size: 21px;
        font-weight: bold;
        line-height: 1;
        cursor: pointer;
        opacity: .5;
    }
    #langsuggestModal .close:hover,
    #langsuggestModal .close:focus {
        opacity: .8;
    }
</style>
<dialog aria-labelledby="langsuggestTitle" class="langsuggest-modal" id="langsuggestModal">
    <form class="modal-content" method="dialog">
        <div class="modal-header">
            <button aria-label="Close" class="close" value="close">
                <span aria-hidden="true">&times;</span>
            </button>
            <h4 class="modal-title" id="langsuggestTitle">
                [[%langsuggest.redirect_title?
                &namespace=`langsuggest`
                &language=`[[+cultureKey]]`
                ]]
            </h4>
        </div>
        <div class="modal-body">
            [[%langsuggest.redirect_message?
            &url=`[[~[[+redirect_id]]]]`
            &namespace=`langsuggest`
            &language=`[[+cultureKey]]`
            ]]
        </div>
        <div class="modal-footer">
            <a autofocus class="btn btn-primary btn-redirect" href="[[~[[+redirect_id]]]]" role="button">[[%yes? &language=`[[+cultureKey]]`]]</a>
            <button class="btn btn-default" value="no">[[%no? &language=`[[+cultureKey]]`]]</button>
        </div>
    </form>
</dialog>
<script>
    (function () {
        var modal = document.getElementById('langsuggestModal');
        // Browsers without dialog support keep the closed dialog hidden
        if (!modal || typeof modal.showModal !== 'function') {
            return;
        }
        var redirect = modal.querySelector('.btn-redirect');
        var cookieDays = parseInt('[[+cookie_expiration]]', 10) || 0;

        function hideLangSuggest() {
            // A cookie expiration of 0 days creates a session cookie
            var maxAge = cookieDays > 0 ? '; max-age=' + (cookieDays * 86400) : '';
            document.cookie = '[[+cookie_name]]=1' + maxAge + '; path=/; SameSite=Lax';
        }

        // The link navigates by itself, the cookie is set before
        if (redirect) {
            redirect.addEventListener('click', hideLangSuggest);
        }

        // A click on the backdrop closes the modal (the dialog content fills the dialog element)
        modal.addEventListener('click', function (e) {
            if (e.target === modal) {
                modal.close();
            }
        });

        // The close and no buttons (form method="dialog") and the Esc key close the modal
        modal.addEventListener('close', function () {
            document.body.classList.remove('langsuggestActive');
        });

        modal.showModal();
    })();
</script>
